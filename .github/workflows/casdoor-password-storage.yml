name: Casdoor password storage
on:
  pull_request:
    paths:
      - 'docker/astronAgent/casdoor/**'
      - 'docker/astronAgent/docker-compose-auth.yml'
      - '.github/workflows/casdoor-password-storage.yml'
  push:
    branches: ['fix/casdoor-password-storage', main]
    paths:
      - 'docker/astronAgent/casdoor/**'
      - 'docker/astronAgent/docker-compose-auth.yml'
      - '.github/workflows/casdoor-password-storage.yml'
permissions:
  contents: read
concurrency:
  group: casdoor-passwords-${{ github.ref }}
  cancel-in-progress: true
jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r docker/astronAgent/casdoor/password-storage/requirements.txt bcrypt==5.0.0
      - name: Unit regressions
        run: python -m unittest discover -s docker/astronAgent/casdoor/password-storage -p test_passwords.py -v
      - name: Authentication deployment without a local helper image
        run: python -m unittest discover -s docker/astronAgent/casdoor/password-storage -p test_compose.py -v
      - name: Actual Casdoor 2.67 and MySQL integration
        run: python -m unittest discover -s docker/astronAgent/casdoor/password-storage -p test_integration.py -v
      - name: Remove disposable test containers
        if: always()
        run: docker compose -p casdoor-password-storage-test -f docker/astronAgent/docker-compose-auth.yml down --volumes --remove-orphans
