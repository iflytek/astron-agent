          initialValue: 2048
          key: maxTokens
          required: true
          desc: 最小值是1, 最大值是8192。控制模型输出的Tokens 长度上限。通常 100 Tokens 约等于150 个中文汉字。
        - standard: true
          constraintContent:
          - name: 0.1
          - name: 1
          precision: 0.1
          required: true
          constraintType: range
          default: 0.5
          name: 核采样阈值
