        code: |-
          import re

          def main(input):
              # 匹配规则：以http/https开头，直到遇到空格或字符串结束（贪婪匹配）
              url = re.findall(r'https?://[^\s]*', input)  # [^\s]* 表示“匹配0个或多个非空白字符”
              ret = {
                  "url": url[0] if url else '',  # 有URL就取第一个，没有就返回空
                  "is_content_url": 'true' if url else 'false'
              }
              return ret
