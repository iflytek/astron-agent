            value: default
            desc: 默认的审核策略
          name: 内容审核的严格程度
          fieldType: string
          support: true
          initialValue: default
          required: false
          key: auditing
          desc: strict表示严格审核策略；moderate表示中等审核策略；show表示演示场景审核策略；default表示默认的审核程度；（需继续下调策略需要申请）
