        - standard: true
          constraintType: range
          default: 4
          constraintContent:
          - name: 1
          - name: 6
          name: 生成多样性
          revealed: true
          support: true
          fieldType: int
          initialValue: 4
          key: topK
          required: true
          desc: 调高会使得模型的输出更多样性和创新性，反之，降低会使输出内容更加遵循指令要求但减少多样性。最小值1，最大值6
        - constraintType: enum
