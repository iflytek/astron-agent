{{- if .Values.ingress.enabled -}}
{{- $consoleApiPath := "/console-api(/|$)(.*)" -}}
{{- $agentsApiPath := "/console-api/(agents(/|$).*)" -}}
{{- $gatewayAuthDenyPath := "/console-api/internal/gateway/auth/workflow(/|$)(.*)" -}}
{{- $artifactUploadDenyPath := "/console-api/workflow/artifacts/internal-upload(/|$)(.*)" -}}
{{- $runtimeConfigDenyPath := "/console-api/skill-sandbox/internal-runtime-config(/|$)(.*)" -}}
{{- $workflowInternalDenyPath := "/console-api/workflow/internal(/|$)(.*)" -}}
{{- $agentResolveDenyPath := "/console-api/agents/internal/resolve(/|$)(.*)" -}}
{{- $agentArtifactDenyPath := "/console-api/agents/artifacts/internal-upload(/|$)(.*)" -}}
{{- range $path := list $gatewayAuthDenyPath $artifactUploadDenyPath $runtimeConfigDenyPath $agentResolveDenyPath $agentArtifactDenyPath $workflowInternalDenyPath -}}
{{- if or (le (len $path) (len $consoleApiPath)) (le (len $path) (len $agentsApiPath)) -}}
{{- fail "internal console API deny paths must remain longer than the Agent and generic API regexes so ingress-nginx orders them first" -}}
{{- end -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "astron-agent.fullname" . }}
  labels:
    {{- include "astron-agent.labels" . | nindent 4 }}
  annotations:
    # SSE support for long-lived connections
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    # Upload size limit
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          # Frontend (default)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "astron-agent.fullname" $ }}-console-frontend
                port:
                  number: {{ $.Values.consoleFrontend.service.port }}
    {{- end }}
{{- if .Values.consoleHub.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "astron-agent.fullname" . }}-workflow-api
  labels:
    {{- include "astron-agent.labels" . | nindent 4 }}
  annotations:
    # Other Ingresses on this host use regex rewrites; anchor every public API.
    nginx.ingress.kubernetes.io/use-regex: "true"
    # SSE support for long-lived connections
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/auth-url: "http://{{ include "astron-agent.fullname" . }}-console-hub.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.consoleHub.service.port }}/internal/gateway/auth/workflow"
    nginx.ingress.kubernetes.io/auth-method: "GET"
    # Overwrite spoofed service identity headers; auth must never return an internal key.
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Consumer-Username,X-Workflow-Gateway-Timestamp,X-Workflow-Gateway-Signature,X-Workflow-Internal-Key"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: "/agent/v1/chat/completions$"
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "astron-agent.fullname" $ }}-console-hub
                port:
                  number: {{ $.Values.consoleHub.service.port }}
          - path: "/workflow/v1/chat/completions$"
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "astron-agent.fullname" $ }}-console-hub
                port:
                  number: {{ $.Values.consoleHub.service.port }}
          - path: "/workflow/v1/resume$"
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "astron-agent.fullname" $ }}-console-hub
                port:
                  number: {{ $.Values.consoleHub.service.port }}
          - path: "/workflow/v1/stop$"
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "astron-agent.fullname" $ }}-console-hub
                port:
                  number: {{ $.Values.consoleHub.service.port }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "astron-agent.fullname" . }}-console-api-agents
  labels:
    {{- include "astron-agent.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Capture the complete Agent path: the collection must stay /agents, not /agents/.
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    # Upload size limit
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: {{ $agentsApiPath | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "astron-agent.fullname" $ }}-console-hub
                port:
                  number: {{ $.Values.consoleHub.service.port }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "astron-agent.fullname" . }}-console-api
  labels:
    {{- include "astron-agent.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    # Upload size limit
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          # ingress-nginx sorts regex locations by descending path length. These
          # service-only paths are longer than both Agent and generic routes and
          # terminate at a selectorless Service with no endpoints (HTTP 503).
          - path: {{ $gatewayAuthDenyPath | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "astron-agent.fullname" $ }}-console-api-deny
                port:
                  number: 80
          - path: {{ $artifactUploadDenyPath | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "astron-agent.fullname" $ }}-console-api-deny
                port:
                  number: 80
          - path: {{ $runtimeConfigDenyPath | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "astron-agent.fullname" $ }}-console-api-deny
                port:
                  number: 80
          - path: {{ $workflowInternalDenyPath | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "astron-agent.fullname" $ }}-console-api-deny
                port:
                  number: 80
          - path: {{ $agentResolveDenyPath | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "astron-agent.fullname" $ }}-console-api-deny
                port:
                  number: 80
          - path: {{ $agentArtifactDenyPath | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "astron-agent.fullname" $ }}-console-api-deny
                port:
                  number: 80
          - path: {{ $consoleApiPath | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "astron-agent.fullname" $ }}-console-hub
                port:
                  number: {{ $.Values.consoleHub.service.port }}
    {{- end }}
{{- end }}
{{- end }}
