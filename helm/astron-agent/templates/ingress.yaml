{{- if .Values.ingress.enabled -}}
{{- $consoleApiPath := "/console-api(/|$)(.*)" -}}
{{- $gatewayAuthDenyPath := "/console-api/internal/gateway/auth/workflow(/|$)(.*)" -}}
{{- $artifactUploadDenyPath := "/console-api/workflow/artifacts/internal-upload(/|$)(.*)" -}}
{{- $runtimeConfigDenyPath := "/console-api/skill-sandbox/internal-runtime-config(/|$)(.*)" -}}
{{- $agentRuntimeDenyPath := "/console-api/internal/agent-runtime(/|$)(.*)" -}}
{{- if or (le (len $gatewayAuthDenyPath) (len $consoleApiPath)) (le (len $artifactUploadDenyPath) (len $consoleApiPath)) (le (len $runtimeConfigDenyPath) (len $consoleApiPath)) (le (len $agentRuntimeDenyPath) (len $consoleApiPath)) -}}
{{- fail "internal console API deny paths must remain longer than the generic /console-api regex so ingress-nginx orders them first" -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "astron-agent.fullname" . }}
  labels:
    {{- include "astron-agent.labels" . | nindent 4 }}
  annotations:
    # SSE support for long-lived connections
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    # Upload size limit
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          # Frontend (default)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "astron-agent.fullname" $ }}-console-frontend
                port:
                  number: {{ $.Values.consoleFrontend.service.port }}
    {{- end }}
{{- if .Values.consoleHub.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "astron-agent.fullname" . }}-workflow-api
  labels:
    {{- include "astron-agent.labels" . | nindent 4 }}
  annotations:
    # SSE support for long-lived connections
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/auth-url: "http://{{ include "astron-agent.fullname" . }}-console-hub.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.consoleHub.service.port }}/internal/gateway/auth/workflow"
    nginx.ingress.kubernetes.io/auth-method: "GET"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Consumer-Username,X-Workflow-Gateway-Timestamp,X-Workflow-Gateway-Signature"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /workflow/v1/chat/completions
            pathType: Exact
            backend:
              service:
                name: {{ include "astron-agent.fullname" $ }}-core-workflow
                port:
                  number: {{ $.Values.coreWorkflow.service.port }}
          - path: /workflow/v1/resume
            pathType: Exact
            backend:
              service:
                name: {{ include "astron-agent.fullname" $ }}-core-workflow
                port:
                  number: {{ $.Values.coreWorkflow.service.port }}
          {{- if $.Values.coreRuntime.enabled }}
          - path: /openapi/v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "astron-agent.fullname" $ }}-core-runtime
                port:
                  number: {{ $.Values.coreRuntime.service.port }}
          {{- end }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "astron-agent.fullname" . }}-console-api-chat
  labels:
    {{- include "astron-agent.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /chat-message/$2
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    # Upload size limit
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /console-api/chat-message(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "astron-agent.fullname" $ }}-console-hub
                port:
                  number: {{ $.Values.consoleHub.service.port }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "astron-agent.fullname" . }}-console-api
  labels:
    {{- include "astron-agent.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    # Upload size limit
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          # ingress-nginx sorts regex locations by descending path length. These
          # service-only paths are deliberately longer than the generic route and
          # terminate at a selectorless Service with no endpoints (HTTP 503).
          - path: {{ $gatewayAuthDenyPath | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "astron-agent.fullname" $ }}-console-api-deny
                port:
                  number: 80
          - path: {{ $artifactUploadDenyPath | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "astron-agent.fullname" $ }}-console-api-deny
                port:
                  number: 80
          - path: {{ $runtimeConfigDenyPath | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "astron-agent.fullname" $ }}-console-api-deny
                port:
                  number: 80
          - path: {{ $agentRuntimeDenyPath | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "astron-agent.fullname" $ }}-console-api-deny
                port:
                  number: 80
          - path: {{ $consoleApiPath | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "astron-agent.fullname" $ }}-console-hub
                port:
                  number: {{ $.Values.consoleHub.service.port }}
    {{- end }}
{{- end }}
{{- end }}
