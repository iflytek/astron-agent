{{- $workflowAuth := default (dict) .Values.workflowInternalAuth }}
{{- $workflowAuthExisting := default (dict) (get $workflowAuth "existingSecret") }}
{{- $workflowAuthExternalName := default "" (get $workflowAuthExisting "name") | toString | trim }}
{{- if not $workflowAuthExternalName }}
{{- $workflowAuthSecretName := include "astron-agent.workflowInternalAuthSecretName" . }}
{{- $workflowAuthSecretKey := include "astron-agent.workflowInternalAuthSecretKey" . }}
{{- $existingWorkflowAuthSecret := lookup "v1" "Secret" .Release.Namespace $workflowAuthSecretName }}
{{- $workflowInternalApiKey := randAlphaNum 64 }}
{{- $existingWorkflowAuthData := dict }}
{{- if $existingWorkflowAuthSecret }}
{{- $existingWorkflowAuthData = default (dict) (get $existingWorkflowAuthSecret "data") }}
{{- end }}
{{- if hasKey $existingWorkflowAuthData $workflowAuthSecretKey }}
{{- $candidateWorkflowInternalApiKey := index $existingWorkflowAuthData $workflowAuthSecretKey | b64dec }}
{{- if and (ge (len $candidateWorkflowInternalApiKey) 32) (le (len $candidateWorkflowInternalApiKey) 128) (not (contains "\r" $candidateWorkflowInternalApiKey)) (not (contains "\n" $candidateWorkflowInternalApiKey)) (ne $candidateWorkflowInternalApiKey "CHANGE_ME_WORKFLOW_INTERNAL_API_KEY") }}
{{- $workflowInternalApiKey = $candidateWorkflowInternalApiKey }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $workflowAuthSecretName }}
  labels:
    {{- include "astron-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $workflowAuthSecretKey }}: {{ $workflowInternalApiKey | quote }}
---
{{- end }}
{{- $runtimeAuth := default (dict) .Values.runtimeInternalAuth }}
{{- $runtimeAuthExisting := default (dict) (get $runtimeAuth "existingSecret") }}
{{- $runtimeAuthExternalName := default "" (get $runtimeAuthExisting "name") | toString | trim }}
{{- if and .Values.coreRuntime.enabled (not $runtimeAuthExternalName) }}
{{- $runtimeAuthSecretName := include "astron-agent.runtimeInternalAuthSecretName" . }}
{{- $runtimeAuthSecretKey := include "astron-agent.runtimeInternalAuthSecretKey" . }}
{{- $existingRuntimeAuthSecret := lookup "v1" "Secret" .Release.Namespace $runtimeAuthSecretName }}
{{- $runtimeInternalApiKey := randAlphaNum 64 }}
{{- $existingRuntimeAuthData := dict }}
{{- if $existingRuntimeAuthSecret }}
{{- $existingRuntimeAuthData = default (dict) (get $existingRuntimeAuthSecret "data") }}
{{- end }}
{{- if hasKey $existingRuntimeAuthData $runtimeAuthSecretKey }}
{{- $candidateRuntimeInternalApiKey := index $existingRuntimeAuthData $runtimeAuthSecretKey | b64dec }}
{{- if and (ge (len $candidateRuntimeInternalApiKey) 32) (le (len $candidateRuntimeInternalApiKey) 128) (not (contains "\r" $candidateRuntimeInternalApiKey)) (not (contains "\n" $candidateRuntimeInternalApiKey)) }}
{{- $runtimeInternalApiKey = $candidateRuntimeInternalApiKey }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $runtimeAuthSecretName }}
  labels:
    {{- include "astron-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $runtimeAuthSecretKey }}: {{ $runtimeInternalApiKey | quote }}
---
{{- end }}
{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "astron-agent.fullname" . }}-postgres-secret
  labels:
    {{- include "astron-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.postgresql.auth.password | quote }}
---
{{- end }}
{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "astron-agent.fullname" . }}-mysql-secret
  labels:
    {{- include "astron-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  mysql-root-password: {{ .Values.mysql.auth.rootPassword | quote }}
---
{{- end }}
{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "astron-agent.fullname" . }}-redis-secret
  labels:
    {{- include "astron-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  redis-password: {{ default "" .Values.redis.auth.password | quote }}
---
{{- end }}
{{- if .Values.casdoor.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "astron-agent.fullname" . }}-casdoor-mysql-secret
  labels:
    {{- include "astron-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  mysql-root-password: {{ .Values.casdoor.mysql.rootPassword | quote }}
  mysql-password: {{ .Values.casdoor.mysql.password | quote }}
{{- end }}
