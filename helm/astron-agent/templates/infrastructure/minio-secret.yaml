{{- $auth := default (dict) .Values.minio.auth -}}
{{- $existingSecret := default "" (get $auth "existingSecret") | toString | trim -}}
{{- if and .Values.minio.enabled (not $existingSecret) }}
{{- $credentials := include "astron-agent.minioManagedCredentials" . | fromJson }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "astron-agent.minioSecretName" . }}
  labels:
    {{- include "astron-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "astron-agent.minioSecretUserKey" . }}: {{ $credentials.user | quote }}
  {{ include "astron-agent.minioSecretPasswordKey" . }}: {{ $credentials.password | quote }}
{{- end }}
