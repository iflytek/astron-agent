{{- if .Values.consoleHub.enabled }}
{{- $fullname := include "astron-agent.fullname" . }}
{{- $dependencies := dict }}
{{- if .Values.mysql.enabled }}
{{- $_ := set $dependencies (printf "%s-mysql" $fullname) 3306 }}
{{- end }}
{{- if .Values.redis.enabled }}
{{- $_ := set $dependencies (printf "%s-redis" $fullname) 6379 }}
{{- end }}
{{- if .Values.minio.enabled }}
{{- $_ := set $dependencies (printf "%s-minio" $fullname) .Values.minio.service.apiPort }}
{{- end }}
{{- $serviceHost := printf "%s-console-hub" $fullname }}
{{- $serviceFqdn := printf "%s.%s.svc.%s" $serviceHost .Release.Namespace .Values.global.clusterDomain }}
{{- $publicOrigin := default .Values.global.hostBaseAddress .Values.consoleHub.auth.publicOrigin }}
{{- $cookieSecure := .Values.consoleHub.auth.cookieSecure | toString }}
{{- if eq $cookieSecure "" }}
{{- $cookieSecure = hasPrefix "https://" $publicOrigin | toString }}
{{- end }}
{{- $csrfOrigins := compact (list $publicOrigin .Values.consoleHub.auth.csrfTrustedOrigins) }}
{{- $allowedHosts := list "localhost" "127.0.0.1" $serviceHost $serviceFqdn }}
{{- if .Values.consoleHub.auth.allowedHosts }}
{{- $allowedHosts = append $allowedHosts .Values.consoleHub.auth.allowedHosts }}
{{- end }}
{{- if .Values.ingress.enabled }}
{{- range .Values.ingress.hosts }}
{{- $allowedHosts = append $allowedHosts (replace "*." "." .host) }}
{{- end }}
{{- end }}
{{- $serviceDefaults := dict
    "mysqlHost" (printf "%s-mysql" $fullname)
    "redisHost" (printf "%s-redis" $fullname)
    "agentUrl" (include "astron-agent.coreAgent.url" .)
    "workflowUrl" (include "astron-agent.coreWorkflow.url" .)
    "knowledgeUrl" (printf "%s/knowledge" (include "astron-agent.coreKnowledge.url" .))
    "toolUrl" (include "astron-agent.coreLink.url" .)
    "toolRpaUrl" (include "astron-agent.coreRpa.url" .)
    "sparkDbUrl" (include "astron-agent.coreDatabase.url" .)
}}
{{- $workflowAuthSecretName := include "astron-agent.workflowInternalAuthSecretName" . }}
{{- $workflowAuthSecretKey := include "astron-agent.workflowInternalAuthSecretKey" . }}
{{- $tenantBootstrapSecretName := include "astron-agent.tenantBootstrapSecretName" . }}
{{- $tenantBootstrapKeyKey := include "astron-agent.tenantBootstrapSecretKeyKey" . }}
{{- $tenantBootstrapSecretKey := include "astron-agent.tenantBootstrapSecretSecretKey" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "astron-agent.fullname" . }}-console-hub
  labels:
    {{- include "astron-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: console-hub
spec:
  replicas: {{ .Values.consoleHub.replicaCount }}
  selector:
    matchLabels:
      {{- include "astron-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console-hub
  template:
    metadata:
      annotations:
        checksum/artifact-upload-secret: {{ include "astron-agent.artifactUploadSecretChecksum" . | quote }}
        internal-secret-name/artifact-upload: {{ include "astron-agent.artifactUploadSecretName" . | quote }}
        checksum/sandbox-runtime-credential-secret: {{ include "astron-agent.sandboxRuntimeCredentialSecretChecksum" . | quote }}
        internal-secret-name/sandbox-runtime-credential: {{ include "astron-agent.sandboxRuntimeCredentialSecretName" . | quote }}
        checksum/object-storage-secret: {{ include "astron-agent.minioSecretChecksum" . | quote }}
        checksum/workflow-internal-auth-secret: {{ include "astron-agent.workflowInternalAuthSecretChecksum" . | quote }}
        internal-secret-name/workflow-internal-auth: {{ $workflowAuthSecretName | quote }}
        checksum/tenant-bootstrap-secret: {{ include "astron-agent.tenantBootstrapSecretChecksum" . | quote }}
        internal-secret-name/tenant-bootstrap: {{ $tenantBootstrapSecretName | quote }}
      labels:
        {{- include "astron-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: console-hub
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      {{- if $dependencies }}
      {{- include "astron-agent.waitForDependencies" $dependencies | nindent 6 }}
      {{- end }}
      - name: validate-object-storage-credentials
        image: busybox:1.35
        imagePullPolicy: IfNotPresent
        env:
        - name: OSS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "astron-agent.minioSecretName" . }}
              key: {{ include "astron-agent.minioSecretUserKey" . }}
        - name: OSS_ACCESS_KEY_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "astron-agent.minioSecretName" . }}
              key: {{ include "astron-agent.minioSecretPasswordKey" . }}
        command:
        - /bin/sh
        - -ec
        - |
          reject_credential() {
            echo "Object-storage credentials are empty, weak, or use a known default." >&2
            exit 1
          }
          access_key_lower="$(printf '%s' "${OSS_ACCESS_KEY_ID}" | tr '[:upper:]' '[:lower:]')"
          access_secret_lower="$(printf '%s' "${OSS_ACCESS_KEY_SECRET}" | tr '[:upper:]' '[:lower:]')"
          [ "${#OSS_ACCESS_KEY_ID}" -ge 8 ] || reject_credential
          [ "${#OSS_ACCESS_KEY_SECRET}" -ge 16 ] || reject_credential
          [ "${OSS_ACCESS_KEY_ID}" != "${OSS_ACCESS_KEY_SECRET}" ] || reject_credential
          case "${access_key_lower}" in minioadmin|admin|administrator|root|changeme|change_me*) reject_credential ;; esac
          case "${access_secret_lower}" in minioadmin|minioadmin123|admin|admin123|password|password123|changeme|change_me*) reject_credential ;; esac
          echo "Object-storage credential policy check passed."
      containers:
      - name: console-hub
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
        image: "{{ .Values.global.imageRegistry }}/{{ .Values.consoleHub.image }}:{{ .Values.global.astronAgentVersion }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        env:
        - name: CONSOLE_RUN_MIGRATIONS
          value: {{ .Values.consoleHub.runMigrations | quote }}
        - name: CONSOLE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ required "consoleHub.auth.existingSecret is required" .Values.consoleHub.auth.existingSecret | quote }}
              key: {{ .Values.consoleHub.auth.secretKey | quote }}
        - name: CONSOLE_ALLOWED_HOSTS
          value: {{ join "," $allowedHosts | quote }}
        - name: CONSOLE_PUBLIC_ORIGIN
          value: {{ $publicOrigin | quote }}
        - name: CONSOLE_CSRF_TRUSTED_ORIGINS
          value: {{ join "," $csrfOrigins | quote }}
        - name: CONSOLE_COOKIE_SECURE
          value: {{ $cookieSecure | quote }}
        - name: CONSOLE_TRUSTED_PROXIES
          value: {{ .Values.consoleHub.auth.trustedProxies | quote }}
        {{- range $key, $value := .Values.consoleHub.env }}
        {{- if hasKey $serviceDefaults $key }}
        - name: {{ upper (snakecase $key) }}
          value: {{ default (get $serviceDefaults $key) $value | quote }}
        {{- else if eq $key "ossEndpoint" }}
        - name: {{ upper (snakecase $key) }}
          value: {{ include "astron-agent.minioEndpoint" $ | quote }}
        {{- else if eq $key "ossRemoteEndpoint" }}
        - name: {{ upper (snakecase $key) }}
          value: {{ include "astron-agent.minioPublicEndpoint" $ | quote }}
        {{- else if eq $key "mysqlPassword" }}
        - name: {{ upper (snakecase $key) }}
          valueFrom:
            secretKeyRef:
              name: {{ include "astron-agent.fullname" $ }}-mysql-secret
              key: mysql-root-password
        {{- else if eq $key "redisPassword" }}
        - name: {{ upper (snakecase $key) }}
          valueFrom:
            secretKeyRef:
              name: {{ include "astron-agent.fullname" $ }}-redis-secret
              key: redis-password
        {{- else if eq $key "ossAccessKeyId" }}
        - name: {{ upper (snakecase $key) }}
          valueFrom:
            secretKeyRef:
              name: {{ include "astron-agent.minioSecretName" $ }}
              key: {{ include "astron-agent.minioSecretUserKey" $ }}
        {{- else if eq $key "ossAccessKeySecret" }}
        - name: {{ upper (snakecase $key) }}
          valueFrom:
            secretKeyRef:
              name: {{ include "astron-agent.minioSecretName" $ }}
              key: {{ include "astron-agent.minioSecretPasswordKey" $ }}
        {{- else if has $key (list "tenantId" "tenantKey" "tenantSecret") }}
        {{/* The canonical TENANT_* variables are injected below. */}}
        {{- else }}
        - name: {{ upper (snakecase $key) }}
          value: {{ $value | quote }}
        {{- end }}
        {{- end }}
        - name: TENANT_URL
          value: {{ include "astron-agent.coreTenant.url" . | quote }}
        - name: TENANT_ID
          value: {{ include "astron-agent.tenantBootstrapID" . | quote }}
        - name: TENANT_KEY
          valueFrom:
            secretKeyRef:
              name: {{ $tenantBootstrapSecretName }}
              key: {{ $tenantBootstrapKeyKey }}
        - name: TENANT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ $tenantBootstrapSecretName }}
              key: {{ $tenantBootstrapSecretKey }}
        - name: SKILL_SANDBOX_ARTIFACT_UPLOAD_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "astron-agent.artifactUploadSecretName" . }}
              key: {{ include "astron-agent.artifactUploadSecretKey" . }}
        - name: SKILL_SANDBOX_RUNTIME_CREDENTIAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "astron-agent.sandboxRuntimeCredentialSecretName" . }}
              key: {{ include "astron-agent.sandboxRuntimeCredentialSecretKey" . }}
        - name: WORKFLOW_INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ $workflowAuthSecretName | quote }}
              key: {{ $workflowAuthSecretKey | quote }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 6
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          {{- toYaml .Values.consoleHub.resources | nindent 10 }}
{{- end }}
