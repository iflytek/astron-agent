# Global settings
global:
  imageRegistry: ghcr.io/iflytek/astron-agent
  imagePullPolicy: IfNotPresent
  storageClass: ""
  # Image tag for Astron Agent services. Empty uses the chart appVersion (a
  # vX.Y.Z release); set "latest" to track rolling builds from main.
  astronAgentVersion: ""
  # Host base address for application access (e.g., https://your-domain.com).
  # MinIO endpoints are configured independently under minio so enabling an
  # application ingress never exposes object storage by accident.
  hostBaseAddress: "http://astron-agent.example.com"

# Optional Langfuse OTLP/HTTP export shared by Agent and Workflow.
langfuse:
  enabled: false
  host: "https://cloud.langfuse.com"
  captureInputOutput: false
  maxAttributeLength: 8192
  environment: "default"
  release: ""
  # Pre-created Kubernetes Secret; never store credentials in values.yaml.
  existingSecret:
    name: ""
    publicKeyKey: "public-key"
    secretKeyKey: "secret-key"
    # Independent Astron-only secret, not a Langfuse project credential.
    traceContextSecretKey: "trace-context-secret"

# Shared authentication for privileged console-hub -> core-workflow calls.
# Leave the name empty to let Helm generate and preserve a random Secret.
workflowInternalAuth:
  existingSecret:
    name: ""
    key: "workflow-internal-api-key"
    # Non-secret version/digest marker. Change it when an external Secret is
    # rotated in place so all consumers restart and reload the environment.
    checksum: ""

# Bootstrap identity shared by Tenant, Console Hub, Agent, and Workflow. The
# tenant ID is intentionally stable because existing data refers to it. Leave
# key/secret and existingSecret.name empty for a zero-configuration install:
# Helm creates a strong random Secret and reuses it on live upgrades via
# `lookup`. For offline GitOps rendering, reference a pre-created Secret because
# `helm template` cannot look up values already stored in a cluster.
tenantBootstrap:
  tenantId: "680ab54f"
  # Explicit values take precedence over existingSecret and must both contain
  # 32-50 URL-safe characters. Prefer the managed/default mode or an existing
  # Secret so credentials do not live in values files.
  key: ""
  secret: ""
  existingSecret:
    name: ""
    keyKey: "tenant-key"
    secretKey: "tenant-secret"
  # Non-secret version/digest marker. Change it whenever an externally managed
  # Secret is rotated in place so all consumers restart together.
  existingSecretChecksum: ""

# Override the full name for consistent resource naming
fullnameOverride: "astron-agent"

# Image pull secrets
imagePullSecrets: []

# Network settings
networkPolicy:
  enabled: false

# Infrastructure Services
postgresql:
  enabled: true
  image: postgres:14
  replicaCount: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  persistence:
    enabled: true
    size: 10Gi
  auth:
    database: sparkdb_manager
    username: spark
    password: spark123
  healthCheck:
    interval: 30
    timeout: 10
    retries: 60

mysql:
  enabled: true
  image: mysql:8.4
  replicaCount: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  persistence:
    enabled: true
    size: 10Gi
  auth:
    rootPassword: root123
  healthCheck:
    interval: 30
    timeout: 10
    retries: 60

redis:
  enabled: true
  image: redis:7
  replicaCount: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    enabled: true
    size: 5Gi
  auth:
    password: 123
  healthCheck:
    interval: 30
    timeout: 10
    retries: 60

minio:
  enabled: true
  # Same upstream release, archived by Bitnami; pin the multi-platform digest.
  image: docker.io/bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
  replicaCount: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  persistence:
    enabled: true
    size: 20Gi
  # MinIO and every in-chart S3 client read one shared Secret. By default the
  # chart creates it from the private, in-cluster quick-start credentials below,
  # so a normal install needs no credential preparation. Set existingSecret to
  # reference an operator-managed Secret instead. Change the defaults before
  # explicitly exposing the MinIO API or console outside the cluster.
  auth:
    existingSecret: ""
    rootUserKey: root-user
    rootPasswordKey: root-password
    # Non-secret version/digest marker; change it when rotating the Secret in
    # place so MinIO and all S3 consumers roll together.
    existingSecretChecksum: ""
    rootUser: minioadmin
    rootPassword: minioadmin123
  # Optional exact origin (scheme + host + optional port; no path/query/fragment)
  # used when generating URLs for clients outside the cluster. Core Agent also
  # receives this as SKILL_RESOURCE_TRUSTED_ORIGIN and trusts no other remote
  # Skill resource origin; consoleHub.env.ossBucketConsole is injected as the
  # matching SKILL_RESOURCE_TRUSTED_BUCKET. Empty keeps URLs on the internal origin.
  publicEndpoint: ""
  # Required when minio.enabled=false and an enabled component uses S3.
  # The same existingSecret above must contain credentials for this endpoint.
  external:
    endpoint: ""
    # Must also be an exact origin when configured.
    publicEndpoint: ""
  service:
    type: ClusterIP
    apiPort: 9000
    nodePort: null
  # The console is a separate service so exposing the API explicitly does not
  # also expose the administrative UI. Keep ClusterIP and use port-forward for
  # local maintenance; set NodePort/LoadBalancer only as an explicit opt-in.
  consoleService:
    enabled: true
    type: ClusterIP
    port: 9001
    nodePort: null
  healthCheck:
    interval: 30
    timeout: 10
    retries: 60

# Authentication Services
casdoor:
