# Global settings
global:
  imageRegistry: ghcr.io/iflytek/astron-agent
  imagePullPolicy: IfNotPresent
  storageClass: ""
  clusterDomain: cluster.local
  astronAgentVersion: latest
  # Public Console origin used for account links and the default Cookie policy.
  # MinIO endpoints are configured independently under minio so enabling an
  # application ingress never exposes object storage by accident.
  hostBaseAddress: "https://astron-agent.example.com"

# Optional Langfuse OTLP/HTTP export shared by Agent and Workflow.
langfuse:
  enabled: false
  host: "https://cloud.langfuse.com"
  captureInputOutput: false
  maxAttributeLength: 8192
  environment: "default"
  release: ""
  # Pre-created Kubernetes Secret; never store credentials in values.yaml.
  existingSecret:
    name: ""
    publicKeyKey: "public-key"
    secretKeyKey: "secret-key"
    # Independent Astron-only secret, not a Langfuse project credential.
    traceContextSecretKey: "trace-context-secret"

# Shared authentication for privileged console-hub -> core-workflow calls.
# Leave the name empty to let Helm generate and preserve a random Secret.
workflowInternalAuth:
  existingSecret:
    name: ""
    key: "workflow-internal-api-key"
    # Non-secret version/digest marker. Change it when an external Secret is
    # rotated in place so all consumers restart and reload the environment.
    checksum: ""

# Bootstrap identity shared by Tenant, Console Hub, Agent, and Workflow. The
# tenant ID is intentionally stable because existing data refers to it. Leave
# key/secret and existingSecret.name empty for a zero-configuration install:
# Helm creates a strong random Secret and reuses it on live upgrades via
# `lookup`. For offline GitOps rendering, reference a pre-created Secret because
# `helm template` cannot look up values already stored in a cluster.
tenantBootstrap:
  tenantId: "680ab54f"
  # Explicit values take precedence over existingSecret and must both contain
  # 32-50 URL-safe characters. Prefer the managed/default mode or an existing
  # Secret so credentials do not live in values files.
  key: ""
  secret: ""
  existingSecret:
    name: ""
    keyKey: "tenant-key"
    secretKey: "tenant-secret"
  # Non-secret version/digest marker. Change it whenever an externally managed
  # Secret is rotated in place so all consumers restart together.
  existingSecretChecksum: ""

# Override the full name for consistent resource naming
fullnameOverride: "astron-agent"

# Image pull secrets
imagePullSecrets: []

# Infrastructure Services
postgresql:
  enabled: true
  image: postgres:14
  replicaCount: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  persistence:
    enabled: true
    size: 10Gi
  auth:
    database: sparkdb_manager
    username: spark
    password: spark123
  healthCheck:
    interval: 30
    timeout: 10
    retries: 60

mysql:
  enabled: true
  image: mysql:8.4
  replicaCount: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  persistence:
    enabled: true
    size: 10Gi
  auth:
    rootPassword: root123
  healthCheck:
    interval: 30
    timeout: 10
    retries: 60

redis:
  enabled: true
  image: redis:7
  replicaCount: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    enabled: true
    size: 5Gi
  auth:
    password: 123
  healthCheck:
    interval: 30
    timeout: 10
    retries: 60

minio:
  enabled: true
  # Same upstream release, archived by Bitnami; pin the multi-platform digest.
  image: docker.io/bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
  replicaCount: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  persistence:
    enabled: true
    size: 20Gi
  # MinIO and its clients share one Secret. Helm generates credentials when
  # rootUser and rootPassword are empty, and reuses them on live upgrades.
  # Use existingSecret for an external S3 endpoint or offline GitOps rendering.
  auth:
    existingSecret: ""
    rootUserKey: root-user
    rootPasswordKey: root-password
    # Non-secret version/digest marker; change it when rotating the Secret in
    # place so MinIO and all S3 consumers roll together.
    existingSecretChecksum: ""
    rootUser: ""
    rootPassword: ""
  # Optional exact origin (scheme + host + optional port; no path/query/fragment)
  # used when generating URLs for clients outside the cluster. Core Agent also
  # receives this as SKILL_RESOURCE_TRUSTED_ORIGIN and trusts no other remote
  # Skill resource origin; consoleHub.env.ossBucketConsole is injected as the
  # matching SKILL_RESOURCE_TRUSTED_BUCKET. Empty keeps URLs on the internal origin.
  publicEndpoint: ""
  # Required when minio.enabled=false and an enabled component uses S3.
  # The same existingSecret above must contain credentials for this endpoint.
  external:
    endpoint: ""
    # Must also be an exact origin when configured.
    publicEndpoint: ""
  service:
    type: ClusterIP
    apiPort: 9000
    nodePort: null
  # The console is a separate service so exposing the API explicitly does not
  # also expose the administrative UI. Keep ClusterIP and use port-forward for
  # local maintenance; set NodePort/LoadBalancer only as an explicit opt-in.
  consoleService:
    enabled: true
    type: ClusterIP
    port: 9001
    nodePort: null
  healthCheck:
    interval: 30
    timeout: 10
    retries: 60

# Core Services
coreTenant:
  enabled: true
  image: core-tenant
  replicaCount: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  service:
    type: ClusterIP
    port: 5052
  env:
    databaseDbType: mysql
    databaseUsername: root
    databasePassword: ""
    databaseUrl: ""
    databaseMaxOpenConns: 5
    databaseMaxIdleConns: 5
    logPath: ./logs/app.log

coreDatabase:
  enabled: true
  image: core-database
  replicaCount: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  service:
    type: ClusterIP
    port: 7990
  env:
    pgsqlHost: ""
    pgsqlPort: 5432
    pgsqlUser: ""
    pgsqlPassword: ""
    pgsqlDatabase: ""
    redisAddr: ""
    redisClusterAddr: ""
    redisPassword: ""
    otlpEndpoint: "127.0.0.1:4317"
    otlpEnable: "0"

coreRpa:
  enabled: true
  image: core-rpa
  replicaCount: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  service:
    type: ClusterIP
    port: 17198
  env:
    otlpEndpoint: "127.0.0.1:4317"
    otlpEnable: "0"
    kafkaEnable: "0"
    xiaowuRpaTaskCreateUrl: "https://newapi.iflyrpa.com/api/rpa-openapi/workflows/execute-async"
    xiaowuRpaTaskQueryUrl: "https://newapi.iflyrpa.com/api/rpa-openapi/executions"

coreLink:
  enabled: true
  image: core-link
  replicaCount: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  service:
    type: ClusterIP
    port: 18888
  env:
    # Empty values derive this release's AI Tools URL and its four exact tool paths.
    aitoolsBaseUrl: ""
    privateEndpointAllowList: ""
    mysqlHost: ""
    mysqlPort: 3306
    mysqlUser: root
    mysqlPassword: ""
    mysqlDb: spark-link
    redisIsCluster: "false"
    redisAddr: ""
    redisClusterAddr: ""
    redisPassword: ""
    otlpEndpoint: "127.0.0.1:4317"
    otlpEnable: "0"
    kafkaEnable: "0"

coreAitools:
  enabled: true
  image: core-aitools
  replicaCount: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  service:
    type: ClusterIP
    port: 18668
  env:
    # Derived from minio.publicEndpoint/external.publicEndpoint by the template.
    ossDownloadHost: ""
    ossType: s3
    # Derived from the global minio endpoint by the template.
    ossEndpoint: ""
    ossAccessKeyId: ""
    ossAccessKeySecret: ""
    ossBucketName: "workflow"
    ossTtl: "157788000"
    kafkaEnable: "0"
    redisClusterAddr: ""
    redisAddr: ""
    redisPassword: ""
    redisDatabase: "0"
    redisDatabaseConsole: ""
    mysqlHost: ""
    mysqlPort: "3306"
    mysqlUser: "root"
    mysqlPassword: ""
    consoleMysqlDb: ""

coreAgent:
  enabled: true
  image: core-agent
  replicaCount: 1
  tavilySecret: {} # Existing Secret. Set name and optionally key (defaults to api-key).
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"
  service:
    type: ClusterIP
    port: 17870
  env:
    serviceLocation: hf
    serviceHost: "0.0.0.0"
    serviceWorkers: "1"
    serviceReload: "false"
    serviceWsPingInterval: "false"
    serviceWsPingTimeout: "false"
    redisClusterAddr: ""
    redisAddr: ""
    redisPassword: ""
    redisExpire: "3600"
    mysqlHost: ""
    mysqlPort: 3306
    mysqlUser: root
    mysqlPassword: ""
    mysqlDb: agent
    otlpEndpoint: "127.0.0.1:4317"
    otlpMetricTimeout: "3000"
    otlpMetricExportIntervalMillis: "3000"
    otlpMetricExportTimeoutMillis: "3000"
    uploadNodeTrace: "true"
    uploadMetrics: "true"
    otlpTraceTimeout: "3000"
    otlpTraceMaxQueueSize: "2048"
    otlpTraceScheduleDelayMillis: "3000"
    otlpTraceMaxExportBatchSize: "2048"
    otlpTraceExportTimeoutMillis: "3000"
    kafkaEnable: "0"
    kafkaTimeout: "60"
    kafkaTopic: spark-agent-builder
    getLinkUrl: ""
    versionsLinkUrl: ""
    runLinkUrl: ""
    chunkQueryUrl: ""
    listMcpPluginUrl: ""
    runMcpPluginUrl: ""
    appAuthHost: ""
    appAuthProt: http

coreKnowledge:
  enabled: true
  image: core-knowledge
  replicaCount: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  service:
    type: ClusterIP
    port: 20010
  env:
    otlpEnable: "0"
    mysqlHost: ""
    mysqlPort: 3306
    mysqlUser: root
    mysqlPassword: ""
    consoleMysqlDb: ""
    redisAddr: ""
    redisClusterAddr: ""
    redisPassword: ""
    redisDatabaseConsole: ""

coreWorkflow:
  enabled: true
  image: core-workflow
  replicaCount: 1
  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
    limits:
      memory: "6Gi"
      cpu: "2000m"
  service:
    type: ClusterIP
    port: 7880
  env:
    # Derived from minio.publicEndpoint/external.publicEndpoint by the template.
    ossDownloadHost: ""
    runtimeEnv: dev
    mysqlHost: ""
    mysqlPort: 3306
    mysqlUser: root
    mysqlPassword: ""
    mysqlDb: workflow
    consoleMysqlDb: ""
    redisDatabaseConsole: ""
    redisClusterAddr: ""
    redisAddr: ""
    redisPassword: ""
    redisExpire: "3600"
    otlpEndpoint: "127.0.0.1:4317"
    otlpEnable: "0"
    otlpMetricExportIntervalMillis: "3000"
    otlpMetricExportTimeoutMillis: "3000"
    otlpMetricTimeout: "3000"
    otlpTraceTimeout: "3000"
    otlpTraceMaxQueueSize: "2048"
    otlpTraceScheduleDelayMillis: "3000"
    otlpTraceMaxExportBatchSize: "500"
    otlpTraceExportTimeoutMillis: "3000"
    ossType: s3
    # Derived from the global minio endpoint by the template.
    ossEndpoint: ""
    ossAccessKeyId: ""
    ossAccessKeySecret: ""
    ossBucketName: "workflow"
    ossTtl: "157788000"
    kafkaEnable: "0"
    kafkaTimeout: "60"
    kafkaTopic: spark-agent-builder
    # Service URLs
    knowledgeBaseUrl: ""
    knowledgeProBaseUrl: ""
    pluginBaseUrl: ""
    # Defaults to this release's Core Link service and port; supports an external override.
    mcpBaseUrl: ""
    workflowBaseUrl: ""
    appManagePlatBaseUrl: ""
    agentBaseUrl: ""
    pgsqlBaseUrl: ""
    rpaBaseUrl: ""

# Console Services
consoleFrontend:
  enabled: true
  image: console-frontend
  replicaCount: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  service:
    type: ClusterIP
    port: 1881

consoleHub:
  enabled: true
  runMigrations: true
  auth:
    existingSecret: astron-console-auth
    secretKey: secret-key
    # Ingress hosts, localhost and the internal Console Service are included.
    allowedHosts: ""
    publicOrigin: ""
    csrfTrustedOrigins: ""
    # Empty follows the public origin scheme.
    cookieSecure: ""
    trustedProxies: ""
  image: console-hub
  replicaCount: 1
  # Internal service credentials. Leave token and existingSecret empty to let
  # Helm generate two independent random Secrets and preserve them across live
  # upgrades. For offline GitOps rendering, use pre-created Secrets because
  # `helm template` cannot look up and reuse cluster values. When rotating an
  # external Secret in place, update existingSecretChecksum to roll all three
  # consumers together. Explicit tokens take precedence over existingSecret and
  # are intended mainly for non-GitOps installations.
  artifactUpload:
    token: ""
    existingSecret: ""
    existingSecretKey: "artifact-upload-token"
    # Non-secret version/digest marker; change whenever the referenced key rotates.
    existingSecretChecksum: ""
  sandboxRuntimeCredential:
    token: ""
    existingSecret: ""
    existingSecretKey: "sandbox-runtime-credential-token"
    # Non-secret version/digest marker; change whenever the referenced key rotates.
    existingSecretChecksum: ""
  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
    limits:
      memory: "6Gi"
      cpu: "2000m"
  service:
    type: ClusterIP
    port: 8080
  env:
    # MySQL Configuration
    mysqlHost: ""
    mysqlPort: 3306
    consoleMysqlDb: astron_console
    mysqlUser: root
    mysqlPassword: ""
    # Redis Configuration
    redisHost: ""
    redisPort: 6379
    redisPassword: ""
    redisDatabaseConsole: 0
    # OSS/MinIO Configuration
    # Both endpoints are derived from the global minio configuration.
    ossRemoteEndpoint: ""
    ossEndpoint: ""
    ossAccessKeyId: ""
    ossAccessKeySecret: ""
    ossBucketConsole: console-oss
    ossPresignExpirySecondsConsole: 600
    # Workflow artifact storage and validation (non-sensitive). The artifact
    # bucket must differ from ossBucketConsole because it is kept private.
    skillSandboxArtifactBucket: workflow-artifacts
    skillSandboxArtifactMaxFileSize: 20MB
    skillSandboxArtifactMaxActiveFilesPerWorkflow: 1000
    skillSandboxArtifactMaxActiveTotalSizePerWorkflow: 1GB
    skillSandboxArtifactAllowedExtensions: "txt,md,csv,json,pdf,png,jpg,jpeg,gif,webp,doc,docx,xls,xlsx,ppt,pptx,zip"
    # Service URLs
    # Empty uses the core-agent Service name and port from this release.
    agentUrl: ""
    knowledgeUrl: ""
    toolUrl: ""
    toolRpaUrl: ""
    workflowUrl: ""
    sparkDbUrl: ""
    localModelUrl: "http://127.0.0.1:33778"
    resourceMcpCatalogUrl: ""
    resourceMcpAuthUrl: ""
    resourceMcpShortUrl: ""
    rpaUrl: "https://newapi.iflyrpa.com"
    # WeChat Platform Configuration
    wechatComponentAppid: your-wechat-component-appid
    wechatComponentSecret: your-wechat-secret
    wechatToken: your-wechat-token
    wechatEncodingAesKey: your-wechat-encoding-aes-key
    adminUid: "9999"

# Ingress configuration
ingress:
  # SECURITY: the console API Ingress uses longer regex paths routed to a
  # selectorless Service for service-only endpoints. The template asserts that
  # these paths remain longer than the generic /console-api route so ingress-nginx
  # orders them first. No snippet annotation is required. Other controllers must
  # provide equivalent longest-path behavior or ingress must remain disabled in
  # favor of a trusted gateway with an explicit public-path allowlist.
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: astron-agent.example.com
  tls:
    - secretName: astron-agent-tls
      hosts:
        - astron-agent.example.com
