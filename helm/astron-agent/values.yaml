# Console Services
consoleFrontend:
  enabled: true
  image: console-frontend
  replicaCount: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  service:
    type: ClusterIP
    port: 1881
  env:
    casdoorId: "astron-agent-client"
    casdoorApp: "astron-agent-app"
    casdoorOrg: "built-in"

consoleHub:
  enabled: true
  image: console-hub
  replicaCount: 1
  # Internal service credentials. Leave token and existingSecret empty to let
  # Helm generate two independent random Secrets and preserve them across live
  # upgrades. For offline GitOps rendering, use pre-created Secrets because
  # `helm template` cannot look up and reuse cluster values. When rotating an
  # external Secret in place, update existingSecretChecksum to roll all three
  # consumers together. Explicit tokens take precedence over existingSecret and
  # are intended mainly for non-GitOps installations.
  artifactUpload:
    token: ""
    existingSecret: ""
    existingSecretKey: "artifact-upload-token"
    # Non-secret version/digest marker; change whenever the referenced key rotates.
    existingSecretChecksum: ""
  sandboxRuntimeCredential:
    token: ""
    existingSecret: ""
    existingSecretKey: "sandbox-runtime-credential-token"
    # Non-secret version/digest marker; change whenever the referenced key rotates.
    existingSecretChecksum: ""
  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
    limits:
      memory: "6Gi"
      cpu: "2000m"
  service:
    type: ClusterIP
    port: 8080
  env:
    # Casdoor Configuration
    consoleCasdoorUrl: ""
    consoleCasdoorId: "astron-agent-client"
    consoleCasdoorApp: "astron-agent-app"
    consoleCasdoorOrg: "built-in"
    consoleDomain: ""
    # MySQL Configuration
    mysqlUrl: "jdbc:mysql://astron-agent-mysql:3306/astron_console?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&createDatabaseIfNotExist=true"
    mysqlUser: root
    mysqlPassword: ""
    # Redis Configuration
    redisHost: astron-agent-redis
    redisPort: 6379
    redisPassword: ""
    redisDatabaseConsole: 0
    # OSS/MinIO Configuration
    # Both endpoints are derived from the global minio configuration.
    ossRemoteEndpoint: ""
    ossEndpoint: ""
    ossAccessKeyId: ""
    ossAccessKeySecret: ""
    ossBucketConsole: console-oss
    ossPresignExpirySecondsConsole: 600
    # Workflow artifact storage and validation (non-sensitive). The artifact
    # bucket must differ from ossBucketConsole because it is kept private.
    skillSandboxArtifactBucket: workflow-artifacts
    skillSandboxArtifactMaxFileSize: 20MB
    skillSandboxArtifactMaxActiveFilesPerWorkflow: 1000
    skillSandboxArtifactMaxActiveTotalSizePerWorkflow: 1GB
    skillSandboxArtifactAllowedExtensions: "txt,md,csv,json,pdf,png,jpg,jpeg,gif,webp,doc,docx,xls,xlsx,ppt,pptx,zip"
    oauth2IssuerUri: ""
    oauth2JwkSetUri: "http://astron-agent-casdoor:8000/.well-known/jwks"
    oauth2Audience: astron-agent-client
    # Tenant Configuration (Important!)
    tenantId: "680ab54f"
    tenantKey: ""
    tenantSecret: ""
    # Common API Configuration
    commonAppid: "680ab54f"
    commonApikey: ""
    commonApiSecret: ""
    # Service URLs
    appUrl: "http://astron-agent-core-tenant:5052/v2/app"
    knowledgeUrl: "http://astron-agent-core-knowledge:20010/knowledge"
    toolUrl: "http://astron-agent-core-link:18888"
    toolRpaUrl: "http://astron-agent-core-rpa:17198"
    workflowUrl: "http://astron-agent-core-workflow:7880"
    sparkDbUrl: "http://astron-agent-core-database:7990"
    localModelUrl: "http://127.0.0.1:33778"
    rpaUrl: "https://newapi.iflyrpa.com"
    # Workflow Service APIs
    workflowChatUrl: "http://astron-agent-core-workflow:7880/workflow/v1/chat/completions"
    workflowDebugUrl: "http://astron-agent-core-workflow:7880/workflow/v1/debug/chat/completions"
    workflowResumeUrl: "http://astron-agent-core-workflow:7880/workflow/v1/resume"
    # Tenant APIs
    tenantCreateApp: "http://astron-agent-core-tenant:5052/v2/app"
    tenantGetAppDetail: "http://astron-agent-core-tenant:5052/v2/app/details"
    tenantVerifyAppAuth: "http://astron-agent-core-tenant:5052/v2/app/key/verify"
    # MaaS Platform Configuration
    maasAppId: "680ab54f"
    maasApiKey: ""
    maasApiSecret: ""
    maasConsumerId: "680ab54f"
    maasConsumerKey: ""
    maasConsumerSecret: ""
    maasWorkflowVersion: "http://127.0.0.1:8080/workflow/version"
    maasSynchronizeWorkFlow: "http://127.0.0.1:8080/workflow"
    maasPublish: "http://127.0.0.1:8080/workflow/publish"
    maasCloneWorkFlow: "http://127.0.0.1:8080/workflow/internal-clone"
    maasGetInputs: "http://127.0.0.1:8080/workflow/get-inputs-info"
    maasCanPublishUrl: "http://127.0.0.1:8080/workflow/can-publish"
    maasPublishApi: "http://astron-agent-core-workflow:7880/workflow/v1/publish"
    maasAuthApi: "http://astron-agent-core-workflow:7880/workflow/v1/auth"
    maasMcpRegister: "http://127.0.0.1:8080/workflow/release"
    maasWorkflowConfig: "http://127.0.0.1:8080/workflow/get-flow-advanced-config"
    botApiCbmBaseUrl: "ws(s)://spark-api-open.xf-yun.com"
    # WeChat Platform Configuration
    wechatComponentAppid: your-wechat-component-appid
    wechatComponentSecret: your-wechat-secret
    wechatToken: your-wechat-token
    wechatEncodingAesKey: your-wechat-encoding-aes-key
    adminUid: "9999"
    botApiMaasBaseUrl: ""

# Ingress configuration
ingress:
  # SECURITY: the console API Ingress uses longer regex paths routed to a
  # selectorless Service for service-only endpoints. The template asserts that
  # these paths remain longer than the generic /console-api route so ingress-nginx
  # orders them first. No snippet annotation is required. Other controllers must
  # provide equivalent longest-path behavior or ingress must remain disabled in
  # favor of a trusted gateway with an explicit public-path allowlist.
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: astron-agent.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: astron-agent-tls
      hosts:
        - astron-agent.example.com

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod Security Context
podSecurityContext:
  fsGroup: 1000

# Security Context
securityContext:
  runAsNonRoot: false
  runAsUser: 0

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}
