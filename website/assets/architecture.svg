<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Astron Agent architecture</title>
<desc id="desc">React frontend accesses Django Console through the same-origin gateway. Console owns authentication, resources, releases and records; core services execute Agents and workflows over HTTP and SSE. Infrastructure supplies persistence, caching, files and execution logs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#60748c"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#172c46}.title{font-size:30px;font-weight:700}.heading{font-size:21px;font-weight:700}.body{font-size:17px}.label{font-size:15px;fill:#425d78}.line{fill:none;stroke:#60748c;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1200" height="900" rx="20" fill="#f5f8fc"/>
