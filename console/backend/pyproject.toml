[project]
name = "astron-console"
version = "0.1.0"
description = "Astron Agent Python control plane"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.2.18,<5.3",
  "argon2-cffi>=25.1,<26",
  "redis>=5,<7",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "sqlalchemy>=2,<3",
  "alembic>=1.16,<2",
  "minio>=7.2,<8",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "e2b>=2.14,<3",
  "openai>=2,<3",
  "anthropic>=0.75,<1",
  "google-genai>=1,<2",
  "mem0ai>=2.2.1,<3",
  "cryptography>=46,<51",
  "pypdf>=5,<7",
  "python-docx>=1.2,<2",
  "croniter>=6,<7",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
mysql = ["mysqlclient>=2.2.7,<3"]

[dependency-groups]
dev = [
    "ruff>=0.11,<1",
    "coverage>=7.6,<8",
    "sqlglot==26.29.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["astron_console/**/*.py", "manage.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
