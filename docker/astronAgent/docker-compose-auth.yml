services:
  casdoor:
    image: casbin/casdoor:v2.67.0
    container_name: astron-agent-casdoor
    restart: always
    user: root
    # Public access is provided by the reverse proxy below.
    environment:
      - GIN_MODE=release
      - CONSOLE_DOMAIN=${CONSOLE_DOMAIN:-http://localhost}
      - HOST_BASE_ADDRESS=${HOST_BASE_ADDRESS:-http://localhost}
      - origin=${CONSOLE_CASDOOR_URL:-http://localhost:8000}
      - originFrontend=${CONSOLE_CASDOOR_URL:-http://localhost:8000}
    volumes:
      - ./casdoor/conf:/conf-templates:ro
      - ./casdoor/entrypoint.sh:/entrypoint.sh:ro
      - casdoor-logs:/logs
    networks:
      - astron-agent-network
    depends_on:
      - casdoor-mysql
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  casdoor-gateway:
    # Debian avoids Alpine musl's pwritev2 incompatibility on older hosts.
    image: nginx:1.30.6-trixie
    restart: always
    ports:
      - "${CASDOOR_BIND_ADDRESS:-0.0.0.0}:${CASDOOR_PORT:-8000}:8000"
    volumes:
      - ./casdoor/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - astron-agent-network
    depends_on:
      casdoor:
        condition: service_started

  casdoor-mysql:
    image: mysql:8.4.6
    container_name: astron-agent-casdoor-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: casdoor
      MYSQL_USER: casdoor
      MYSQL_PASSWORD: "${CASDOOR_MYSQL_PASSWORD:-casdoor123}"
    volumes:
      - casdoor-mysql-data:/var/lib/mysql
    networks:
      - astron-agent-network
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

# ============================================================================
# Network Configuration
# ============================================================================
networks:
  astron-agent-network:
    driver: bridge

volumes:
  casdoor-logs:
  casdoor-mysql-data:
