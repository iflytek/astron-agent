worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Access log
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Basic configuration
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Upload size limit
    client_max_body_size 20m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/xml+rss
        application/javascript
        application/json;

    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Static resource caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://console-frontend:1881;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Internal auth subrequest used by public workflow API locations.
        location = /_gateway_auth/workflow {
            internal;
            proxy_pass http://console-hub:8080/internal/gateway/auth/workflow;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Consumer-Username "";
            proxy_set_header X-Workflow-Internal-Key "";
            proxy_set_header X-Workflow-Gateway-Timestamp "";
            proxy_set_header X-Workflow-Gateway-Signature "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Public Agent API: Console authenticates the application and resolves its release.
        location = /agent/v1/chat/completions {
            auth_request /_gateway_auth/workflow;

            proxy_pass http://console-hub:8080/agent/v1/chat/completions;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Consumer-Username "";
            proxy_set_header X-Workflow-Internal-Key "";
            proxy_set_header X-Workflow-Gateway-Timestamp "";
            proxy_set_header X-Workflow-Gateway-Signature "";
            proxy_set_header Authorization $http_authorization;
            proxy_hide_header X-Workflow-Internal-Key;
            proxy_hide_header X-Workflow-Gateway-Timestamp;
            proxy_hide_header X-Workflow-Gateway-Signature;

            # SSE specific settings
            proxy_buffering off;                    # Disable buffering for real-time data transmission
            proxy_cache off;                        # Disable caching
            proxy_set_header Connection '';         # SSE uses persistent connections
            proxy_http_version 1.1;                 # Use HTTP/1.1
            chunked_transfer_encoding on;           # Enable chunked transfer encoding

            # Prevent nginx from buffering responses
            proxy_set_header X-Accel-Buffering no;

            # Timeout settings - SSE requires long-lived connections
            proxy_connect_timeout 60s;
            proxy_send_timeout 1800s;                # 30 minutes send timeout
            proxy_read_timeout 1800s;                # 30 minutes read timeout

            # Set correct headers for SSE
            add_header Cache-Control 'no-cache';
            add_header X-Accel-Buffering 'no';
        }

        # SSE (Server-Sent Events) API proxy for workflow chat completions
        location = /workflow/v1/chat/completions {
            auth_request /_gateway_auth/workflow;

            proxy_pass http://console-hub:8080/workflow/v1/chat/completions;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Consumer-Username "";
            proxy_set_header X-Workflow-Internal-Key "";
            proxy_set_header X-Workflow-Gateway-Timestamp "";
            proxy_set_header X-Workflow-Gateway-Signature "";
            proxy_set_header Authorization $http_authorization;
            proxy_hide_header X-Workflow-Internal-Key;
            proxy_hide_header X-Workflow-Gateway-Timestamp;
            proxy_hide_header X-Workflow-Gateway-Signature;

            # SSE specific settings
            proxy_buffering off;                    # Disable buffering for real-time data transmission
            proxy_cache off;                        # Disable caching
            proxy_set_header Connection '';         # SSE uses persistent connections
            proxy_http_version 1.1;                 # Use HTTP/1.1
            chunked_transfer_encoding on;           # Enable chunked transfer encoding

            # Prevent nginx from buffering responses
            proxy_set_header X-Accel-Buffering no;

            # Timeout settings - SSE requires long-lived connections
            proxy_connect_timeout 60s;
            proxy_send_timeout 1800s;                # 30 minutes send timeout
            proxy_read_timeout 1800s;                # 30 minutes read timeout

            # Set correct headers for SSE
            add_header Cache-Control 'no-cache';
            add_header X-Accel-Buffering 'no';
        }

        # Public workflow resume endpoint, protected by the same gateway auth.
        location = /workflow/v1/resume {
            auth_request /_gateway_auth/workflow;

            proxy_pass http://console-hub:8080/workflow/v1/resume;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Consumer-Username "";
            proxy_set_header X-Workflow-Internal-Key "";
            proxy_set_header X-Workflow-Gateway-Timestamp "";
            proxy_set_header X-Workflow-Gateway-Signature "";
            proxy_set_header Authorization $http_authorization;
            proxy_hide_header X-Workflow-Internal-Key;
            proxy_hide_header X-Workflow-Gateway-Timestamp;
            proxy_hide_header X-Workflow-Gateway-Signature;

            # SSE specific settings
            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 1800s;
            proxy_read_timeout 1800s;
        }

        location = /workflow/v1/stop {
            auth_request /_gateway_auth/workflow;
            proxy_pass http://console-hub:8080/workflow/v1/stop;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Consumer-Username "";
            proxy_set_header X-Workflow-Internal-Key "";
            proxy_set_header X-Workflow-Gateway-Timestamp "";
            proxy_set_header X-Workflow-Gateway-Signature "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 30s;
        }

        # Do not expose other Agent/workflow internal APIs through the public gateway.
        location ^~ /agent/v1/ {
            return 404;
        }

        location ^~ /workflow/v1/ {
            return 404;
        }

        # Agent definition resolution and artifact uploads are service-to-service
        # only; longer deny prefixes take precedence over the Agent SSE route.
        location ^~ /console-api/agents/internal/resolve {
            return 404;
        }

        location ^~ /console-api/agents/artifacts/internal-upload {
            return 404;
        }

        # Exact collection match prevents the trailing-slash SSE location from
        # issuing Nginx's implicit 301 for list/create requests.
        location = /console-api/agents {
            proxy_pass http://console-hub:8080/agents;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # SSE (Server-Sent Events) API proxy for independent Agent chat and debug
        location ^~ /console-api/agents/ {
            proxy_pass http://console-hub:8080/agents/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE specific settings
            proxy_buffering off;                    # Disable buffering for real-time data transmission
            proxy_cache off;                        # Disable caching
            proxy_set_header Connection '';         # SSE uses persistent connections
            proxy_http_version 1.1;                 # Use HTTP/1.1
            chunked_transfer_encoding on;           # Enable chunked transfer encoding

            # Prevent nginx from buffering responses
            proxy_set_header X-Accel-Buffering no;

            # Timeout settings - SSE requires long-lived connections
            proxy_connect_timeout 60s;
            proxy_send_timeout 1800s;                # 30 minutes send timeout
            proxy_read_timeout 1800s;                # 30 minutes read timeout

            # Set correct headers for SSE
            add_header Cache-Control 'no-cache';
            add_header X-Accel-Buffering 'no';
        }

        # Public release chat uses the same long-lived SSE contract as Agent debug.
        location ^~ /console-api/published/ {
            proxy_pass http://console-hub:8080/published/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            proxy_set_header X-Accel-Buffering no;
            proxy_connect_timeout 60s;
            proxy_send_timeout 1800s;
            proxy_read_timeout 1800s;
            add_header Cache-Control 'no-cache';
            add_header X-Accel-Buffering 'no';
        }

        location ^~ /console-api/workflow/internal/ {
            return 404;
        }

        location = /console-api/workflow {
            proxy_pass http://console-hub:8080/workflow;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /console-api/workflow/ {
            proxy_pass http://console-hub:8080/workflow/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            add_header X-Accel-Buffering 'no';
        }

        # The gateway auth endpoint is only reachable through internal auth_request.
        location ^~ /console-api/internal/gateway/auth/workflow {
            return 404;
        }

        # Sandbox artifact uploads are service-to-service only. Core services use
        # the console-hub address on the private Compose network.
        location ^~ /console-api/workflow/artifacts/internal-upload {
            return 404;
        }
        location ^~ /console-api/workflow/artifacts/console-upload {
            return 404;
        }

        # Runtime sandbox credentials are resolved only by core services over the
        # private Compose network and must never pass through the public gateway.
        location ^~ /console-api/skill-sandbox/internal-runtime-config {
            return 404;
        }

        # Backend API proxy - proxy /console-api path to console-hub
        location /console-api/ {
            proxy_pass http://console-hub:8080/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout settings
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Frontend application proxy - default proxy to console-frontend
        location / {
            proxy_pass http://console-frontend:1881;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout settings
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Health check
        location /nginx-health {
            access_log off;
            return 200 "nginx is healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
