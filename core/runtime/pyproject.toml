[project]
name = "astron-agent-runtime"
version = "0.1.0"
description = "Durable asynchronous runtime for published Astron agents"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.1,<2",
    "celery[redis]>=5.6.2,<6",
    "fastapi>=0.115.12,<1",
    "httpx>=0.27.0,<1",
    "langgraph>=1.0.1,<2",
    "langgraph-checkpoint-postgres>=3.0.0,<4",
    "psycopg[binary]>=3.2.3,<4",
    "pydantic-settings>=2.8.1,<3",
    "pyjwt[crypto]>=2.10.1,<3",
    "sqlalchemy>=2.0.30,<3",
    "uvicorn[standard]>=0.34.0,<1",
]

[dependency-groups]
dev = [
    "black==24.4.2",
    "flake8==7.0.0",
    "isort==5.13.2",
    "mypy==1.18.2",
    "pytest>=8.2.2,<9",
    "pytest-cov>=7.0.0,<8",
]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
